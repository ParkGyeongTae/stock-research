site_name: 주식 리서치 노트
site_description: 미국 상장 기업/섹터 투자 리서치 정리
site_url: https://parkgyeongtae.github.io/stock-research/
repo_url: https://github.com/ParkGyeongTae/stock-research
repo_name: stock-research

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - tables
  - footnotes
  - admonition
  - pymdownx.details   # ??? 접히는 admonition — 표 읽는 기준 등 참조 정보를 접어두는 데 씀
  - attr_list
  - toc:
      permalink: true
